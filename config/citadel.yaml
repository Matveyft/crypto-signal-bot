# Citadel (cryptoangel.trade) — сторонний терминал: забор данных и теневые сигналы.
#
# Ничего не уходит в Telegram и не влияет на живые сетапы: события пишутся в
# таблицу shadow_signals и в Redis (ключи citadel:*). Отчёт:
#     .venv/bin/python -m scripts.analyze_shadow
#
# Архив открыт без ключей и может закрыться в любой момент: при сбое лента
# просто ждёт и пробует снова (пауза растёт до max_retry_sec).

enabled: true

base_url: "https://cryptoangel.trade"
# Нейтральное имя клиента для чужого сервера (без имени проекта и контактов)
user_agent: "market-data-client/1.0"
timeout_sec: 20                 # на один HTTP-запрос
max_retry_sec: 900              # потолок паузы между попытками при сбоях

poll:
  alerts_sec: 20                # /api/alerts — «Тотал Анализ» (только BTC)
  trdr_sec: 30                  # /api/trdr — метки TRDR (только BTC)
  marks_sec: 30                 # /api/marks — каскады и ловушки по монетам
  book_sec: 30                  # /api/ob_now — агрегированный стакан ~15 бирж

# Стакан: группы рынков в одном ответе и сколько стен каждой стороны класть в Redis
book_groups: ["ALL", "SPOT", "PERP"]
book_walls: 5

# Каскады/ловушки: таймфреймы и параметры расчёта (значения терминала по умолчанию)
marks_timeframes: ["15m"]      # доступны 5m, 15m, 30m, 1h, 4h
marks_days: 30
marks_max_age_min: 30          # событие старше (от закрытия его свечи) не берём вовсе
# Кандидат — только свежее событие. Замеченное позже этого срока после его
# времени пишем в лог без уровней: цена на момент события уже неизвестна.
# Относится и к алертам за lookback_hours при первом запуске.
candidate_max_delay_min: 10
marks_cfg:
  casAuto: true
  casRare: 2
  casFloor: 1
  casN: 20
  casWick: 0.4
  casReclaim: false
  casK: 4
  casOi: 4
  trapOi: 4
  casConf: any
  casCd: 8
  trapOn: true

# Символ бота, к которому относятся алерты «Тотал Анализ» (в них нет монеты —
# в терминале их считают по BTC). Если этой монеты нет в symbols.yaml, лента
# всё равно читается, но кандидатов не создаёт.
alerts_symbol: "BTC/USDT:USDT"

# Метки TRDR архив отдаёт только по биткоину (символы в формате Citadel)
trdr_symbols: ["BTCUSDT"]

# Какие события становятся кандидатами. Пусто = все. Имена видов — как в архиве:
#   алерты: bid-8-30, bid-3-15, bid-3-30, ask-8-30, ask-3-15, ask-3-30,
#           ex-50, ex-40, ex-30, ex-20
#   TRDR:   diamond, btcdd, altdd, gandalf, cross15, x2510, liq100, triple
alert_kinds: []
trdr_kinds: []

# При первом запуске (курсора в Redis ещё нет) взять алерты за столько часов
lookback_hours: 24
# «Первый в серии»: пауза с предыдущего алерта того же вида (столбец onset).
# Алерты — состояние и повторяются примерно раз в час; отчёт умеет смотреть
# только первые.
onset_gap_hours: 2
