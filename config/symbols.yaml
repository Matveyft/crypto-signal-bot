# Торгуемые пары — USDT perpetual futures на Bybit.
# Активный набор (2026-10-04): расширение воронки до 10 монет.
# Возврат остальных: добавьте строку, прогоните load_historical и запустите u.sh.
symbols:
  - BTC/USDT:USDT
  - ETH/USDT:USDT
  - SOL/USDT:USDT
  - XRP/USDT:USDT
  - ADA/USDT:USDT
  - BNB/USDT:USDT
  - ZEC/USDT:USDT
  - HYPE/USDT:USDT
  - DOGE/USDT:USDT
  - ARB/USDT:USDT

timeframes:
  base: "1m"          # собирается с WebSocket
  aggregated: ["5m", "15m", "1h", "4h", "1d"]

historical:
  days_back: 30
  candles_per_request: 1000
