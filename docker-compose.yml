services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: csb-timescaledb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_signals}
    ports:
      # Внешний порт 5433, чтобы не конфликтовать с локальным PostgreSQL на 5432
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader} -d ${POSTGRES_DB:-crypto_signals}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: csb-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  timescale_data:
  redis_data:
